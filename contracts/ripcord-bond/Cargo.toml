[package]
name = "ripcord-bond"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
soroban-sdk = "=23.0.1"
[dev-dependencies]
soroban-sdk = { version = "=23.0.1", features = ["testutils"] }
[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
